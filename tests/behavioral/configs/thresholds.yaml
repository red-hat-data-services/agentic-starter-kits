# Thresholds calibrated from 3 btest runs (2026-08-05, 2026-08-10 x2).
# Formula: observed_p5 - 10% margin. See RHAIENG-6151 for raw data.

langgraph_react:
  tool_selection_accuracy: 0.90
  response_coherence_accuracy: 0.75
  max_latency_p95: 8.0
  pass_at_k: 8

vanilla_python:
  # tool_selection observed 0.85 after multi-action loop fix; conservative threshold
  tool_selection_accuracy: 0.60
  # multi_tool pass@k now works after agent loop fix (iterates all actions per turn)
  multi_tool_accuracy: 0.25
  response_coherence_accuracy: 0.75
  max_latency_p95: 15.0
  pass_at_k: 8

autogen_mcp:
  tool_selection_accuracy: 0.85
  response_coherence_accuracy: 0.75
  # single-tool-call latency observed 9.91s in CI (run 34183046184), repeatedly
  # exceeding the old 8.0 threshold; raised with margin above the observed value
  max_latency_p95: 12.0
  pass_at_k: 8

crewai_websearch:
  # pass@k tool_selection extremely flaky: 1.0, 0.625, 0.12 across 3 runs.
  # Model intermittently answers from memory instead of calling search tool.
  # p5 ~0.12, threshold = 0.10 to catch complete regressions only.
  tool_selection_accuracy: 0.10
  response_coherence_accuracy: 0.75
  # Nightly btests observed 13.1-13.6s (2026-09-13 .. 2026-10-20) against the
  # old 12.0s, missing by ~1s; raised above observed max with margin.
  max_latency_p95: 16.0
  pass_at_k: 8

agentic_rag:
  tool_selection_accuracy: 0.85
  response_coherence_accuracy: 0.75
  max_latency_p95: 10.0
  pass_at_k: 8

langgraph_db_memory:
  # latency observed 11.7s / 14.4s; p95 ~14.4, threshold = 18.0
  # Nightly btests (2026-09-11 .. 2026-10-19) repeatedly missed the old 18.0
  # by <=0.9s (observed 18.2-18.9s); raised above observed max with margin.
  tool_selection_accuracy: 0.85
  response_coherence_accuracy: 0.75
  max_latency_p95: 22.0
  pass_at_k: 8

llamaindex_websearch:
  tool_selection_accuracy: 0.85
  response_coherence_accuracy: 0.75
  # Nightly btests observed 12.3-12.6s (2026-09-04, 2026-09-23) against the
  # old 12.0s, marginal misses; raised above observed max with margin.
  max_latency_p95: 15.0
  pass_at_k: 8

langflow_tool_calling:
  # 1 run (2026-08-10): 29/29 passed, p95 latency 12.7s
  tool_selection_accuracy: 0.75
  multi_tool_accuracy: 0.65
  response_coherence_accuracy: 0.70
  max_latency_p95: 20.0
  pass_at_k: 8

langgraph_hitl:
  tool_selection_accuracy: 0.85
  response_coherence_accuracy: 0.75
  # The old 5.0s was missed even by the stateless "Hello" probe in nightly
  # btests: observed 6.7-7.0s (2026-09) and 22.1-22.5s (2026-10) as shared
  # model serving slowed; raised above observed max with margin.
  max_latency_p95: 25.0
  pass_at_k: 8

langgraph_guardrailed:
  # balance-lookup latency ~13s; knowledge answers ~32s.
  # Eval timeout is 90s; OpenShift route timeout must be >30s or knowledge 504s.
  tool_selection_accuracy: 0.85
  response_coherence_accuracy: 0.75
  max_latency_p95: 18.0
  pass_at_k: 8

google_adk:
  tool_selection_accuracy: 0.85
  response_coherence_accuracy: 0.75
  max_latency_p95: 12.0
  pass_at_k: 8

a2a_langgraph_crewai:
  tool_selection_accuracy: 0.85
  response_coherence_accuracy: 0.75
  # Two-hop agent; nightly btests observed 21.7s (2026-09-19) against the old
  # 20.0s; raised above observed max with margin.
  max_latency_p95: 25.0
  pass_at_k: 8
