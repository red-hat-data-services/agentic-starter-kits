apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}-secret
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
data:
  postgresql-user: {{ .Values.auth.username | b64enc | quote }}
  postgresql-password: {{ required "auth.password is required — set via --set auth.password=<value>" .Values.auth.password | b64enc | quote }}
  postgresql-database: {{ .Values.auth.database | b64enc | quote }}
