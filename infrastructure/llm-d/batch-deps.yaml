# Backing services for the llm-d batch gateway: Redis + PostgreSQL.
#
# These are dev-grade single-replica deployments for trying out batch
# inference. For production, use a managed database or a highly available
# Redis/Valkey and PostgreSQL deployment.
#
# The batch gateway uses:
#   - Redis    as the async request/result queue transport
#   - PostgreSQL for batch job metadata (dbBackend: postgresql)
#
# Credentials here (batchgw/batchgwpass) are examples — replace them and match
# the postgresql-url in llmbatchgateway.yaml's Secret.
#
# Usage:
#   oc apply -f batch-deps.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-redis
  namespace: redhat-ods-applications
  labels:
    app: batch-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch-redis
  template:
    metadata:
      labels:
        app: batch-redis
    spec:
      containers:
        - name: redis
          image: registry.redhat.io/rhel9/redis-7
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: batch-redis
  namespace: redhat-ods-applications
spec:
  selector:
    app: batch-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-postgres
  namespace: redhat-ods-applications
  labels:
    app: batch-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch-postgres
  template:
    metadata:
      labels:
        app: batch-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15
          env:
            - name: POSTGRESQL_USER
              value: batchgw
            - name: POSTGRESQL_PASSWORD
              value: batchgwpass
            - name: POSTGRESQL_DATABASE
              value: batchgateway
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["/usr/bin/pg_isready", "-U", "batchgw", "-d", "batchgateway"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: batch-postgres
  namespace: redhat-ods-applications
spec:
  selector:
    app: batch-postgres
  ports:
    - port: 5432
      targetPort: 5432
