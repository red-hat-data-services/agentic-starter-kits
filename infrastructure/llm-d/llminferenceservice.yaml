# LLMInferenceService for llm-d deployment on OpenShift AI (RHOAI 3.6+)
#
# Uses the v1alpha2 API with baseRefs presets introduced in RHOAI 3.6. The
# preset (LLMInferenceServiceConfig) supplies the vLLM launch command, health
# probes, security context, and a pvc-evictor sidecar — only overrides need to
# be specified here.
#
# Before applying, replace the following placeholders with your values:
#
#   <SERVICE_NAME>    - Name for this deployment (e.g., my-model-llmd)
#   <MODEL_URI>       - HuggingFace model URI (e.g., hf://openai/gpt-oss-20b)
#   <MODEL_NAME>      - Model identifier for API requests (e.g., openai/gpt-oss-20b)
#   <REPLICAS>        - Number of vLLM replicas, one per GPU node (e.g., 6)
#   <NODE_POOL_NAME>  - Label on GPU nodes for scheduling (e.g., gpu-llmd-nodes)
#   <VLLM_IMAGE>      - Current vLLM image from the Red Hat Ecosystem Catalog
#                       (e.g., registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:...)
#                       Find the latest at: https://catalog.redhat.com/en/software/containers/rhaiis/vllm-cuda-rhel9/6825c6b827e18fe3162148a9
#
# Discover the presets available on your cluster (names are version-prefixed):
#   oc get llminferenceserviceconfigs -n redhat-ods-applications
#
# GPU presets:  v3-6-0-kserve-config-llm-template (single-node),
#               -multi-node-*, -prefill-/-decode-* (disaggregated PD)
# CPU preset:   v3-6-0-kserve-config-llm-template-cpu
#
# Deploy in redhat-ods-applications namespace (required by the gateway routing).
#
# Usage:
#   oc apply -f llminferenceservice.yaml

apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: <SERVICE_NAME>
  namespace: redhat-ods-applications
  annotations:
    opendatahub.io/model-type: generative
    openshift.io/display-name: <SERVICE_NAME>
    # WARNING: auth is disabled because maas-default-gateway has no OAuth
    # proxy and no Red Hat Connectivity Link is installed. Any client that
    # can reach the gateway host can invoke this model and consume GPU
    # capacity. For production, install Connectivity Link and REMOVE this
    # annotation to enforce authentication.
    security.opendatahub.io/enable-auth: 'false'
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
spec:
  # baseRefs pulls in the versioned preset: launch command, probes, and
  # security context come from the preset; fields below are merged over it.
  baseRefs:
    - name: v3-6-0-kserve-config-llm-template
  replicas: <REPLICAS>
  model:
    uri: <MODEL_URI>
    name: <MODEL_NAME>
  router:
    # route: {} creates the HTTPRoute for external access
    route: {}
    # scheduler: {} is REQUIRED — without it, the controller skips
    # creating the scheduler/router deployment and InferencePool
    scheduler: {}
    # Use maas-default-gateway (no OAuth proxy) instead of
    # data-science-gateway (which has OAuth and blocks API clients)
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    nodeSelector:
      node-pool: <NODE_POOL_NAME>
    # GPU nodes are tainted nvidia.com/gpu=true:NoSchedule by the NVIDIA GPU
    # Operator — tolerate the taint to schedule on them.
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Equal
        value: 'true'
    containers:
      - name: main
        # The preset pins a vLLM image digest, but published digests are
        # periodically removed from registry.redhat.io. If the workload pod
        # reports ErrImagePull ("manifest unknown"), override the image with
        # the current digest from the Red Hat Ecosystem Catalog.
        image: <VLLM_IMAGE>
        env:
          # Tool calling requires the parser matching your model family
          # (openai for gpt-oss, hermes for Qwen, llama3_json for Llama,
          # mistral for Mistral) and --enable-auto-tool-choice.
          - name: VLLM_ADDITIONAL_ARGS
            value: "--max-model-len=16000 --tool-call-parser=openai --enable-auto-tool-choice"
          - name: HF_HOME
            value: /tmp/huggingface
          - name: HOME
            value: /tmp
          - name: XDG_CACHE_HOME
            value: /tmp/.cache
        resources:
          limits:
            cpu: '4'
            memory: 16Gi
            nvidia.com/gpu: '1'
          requests:
            cpu: '2'
            memory: 8Gi
            nvidia.com/gpu: '1'
