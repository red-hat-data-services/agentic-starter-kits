# The MaaS gateway used by LLMInferenceService router.gateway.refs.
#
# The aigateway/modelsAsAService DSC component REQUIRES this Gateway to
# already exist — the maas-controller fails to reconcile without it
# ("gateway openshift-ingress/maas-default-gateway not found"). On clusters
# where a model was deployed through the OpenShift AI dashboard, the gateway
# already exists and this manifest is a no-op.
#
# The ConfigMap is referenced by the Gateway's infrastructure.parametersRef and
# makes the generated Service a ClusterIP with an OpenShift serving certificate
# (auto-issued into the maas-default-gateway-service-tls Secret referenced by
# the HTTPS listener).
#
# Usage:
#   oc apply -f maas-gateway.yaml

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    istio.io/rev: openshift-gateway
spec:
  gatewayClassName: data-science-gateway-class
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: maas-default-gateway-config
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: maas-default-gateway-service-tls
        mode: Terminate
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [openshift-ingress, redhat-ods-applications]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-default-gateway-config
  namespace: openshift-ingress
data:
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "maas-default-gateway-service-tls"
    spec:
      type: ClusterIP
