name: opencode
displayName: "OpenCode"
framework: opencode
description: "OpenCode agentic coding tool deployed on OpenShift via kustomize (web and CLI modes with OAuth) or in an OpenShell sandbox."
labels: ["coding-agent", "cli"]
logo: "data:image/svg+xml;base64,"
env:
  required:
    - BASE_URL
    - API_KEY
    - MODEL_NAME
  optional:
    - MLFLOW_TRACKING_URI
    - MLFLOW_EXPERIMENT_NAME
