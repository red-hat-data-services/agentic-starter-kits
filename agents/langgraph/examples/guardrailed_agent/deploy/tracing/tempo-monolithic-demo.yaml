# Optional demo Tempo backend for guardrails tracing (RHOAI 3.4+).
#
# This is the *quick path* for a tutorial cluster: a single TempoMonolithic
# with in-memory storage and the Jaeger UI enabled — no object storage, no
# separate Collector CR. The Tempo Operator (subscribe to `tempo-product` on
# OperatorHub) must already be installed; it is the controller, this CR is the
# actual Tempo instance.
#
# Apply into the same namespace as the guardrails deployment (no namespace
# field in this file — `oc apply -n` sets it):
#   oc apply -n <ns> -f deploy/tracing/tempo-monolithic-demo.yaml
#
# It creates:
#   - Service "tempo-guardrails-tracing"          (OTLP gRPC :4317, HTTP :4318)
#   - Route   "tempo-guardrails-tracing-jaegerui" (trace UI, often oauth-proxy)
#
# Point cluster.env at the OTLP service:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo-guardrails-tracing.<ns>.svc.cluster.local:4317
#
# NOTE: this is a demo backend, not a supported production one. The Tempo
# Operator will warn that a TempoMonolithic without multi-tenancy provides no
# authN/authZ on ingest/query and "is not supported on OpenShift" — expected
# and fine for a short-lived tutorial. In-memory storage is also ephemeral
# (traces are lost on pod restart). For a durable backend use TempoStack with
# object storage; see deploy/tracing/README.md.
apiVersion: tempo.grafana.com/v1alpha1
kind: TempoMonolithic
metadata:
  name: guardrails-tracing
spec:
  storage:
    traces:
      backend: memory
  jaegerui:
    enabled: true
    route:
      enabled: true
