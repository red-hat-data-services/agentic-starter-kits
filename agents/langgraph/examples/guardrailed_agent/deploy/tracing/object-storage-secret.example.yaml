# Object-storage credentials for a durable TempoStack (see README).
#
# TempoStack (unlike the demo TempoMonolithic) persists traces to object
# storage, so it needs a Secret with bucket credentials. This is a TEMPLATE —
# copy it, fill in real values, and apply it BEFORE the TempoStack CR:
#
#   cp object-storage-secret.example.yaml object-storage-secret.yaml
#   # edit object-storage-secret.yaml with real values
#   oc apply -n <ns> -f object-storage-secret.yaml
#
# NEVER commit the filled-in copy — object-storage-secret.yaml is gitignored.
#
# Works with AWS S3, MinIO (including minio-demo.yaml), or ODF buckets. The
# Secret's `name` must match `spec.storage.secret.name` in
# tempo-stack-production.yaml. Do not set metadata.namespace — `oc apply -n`
# selects the namespace.
apiVersion: v1
kind: Secret
metadata:
  name: tempo-object-storage
type: Opaque
stringData:
  # For AWS S3: https://s3.<region>.amazonaws.com  (and set `region` below)
  # For minio-demo.yaml in this namespace:
  #   http://minio.<ns>.svc.cluster.local:9000
  endpoint: http://minio.example.svc.cluster.local:9000
  bucket: guardrails-tempo-traces
  access_key_id: tempo
  access_key_secret: temposupersecret
