apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: langgraph-guardrailed-agent-guardrails
  labels:
    app.kubernetes.io/name: langgraph-guardrailed-agent-guardrails
    app.kubernetes.io/component: nemoguardrails
  annotations:
    security.opendatahub.io/enable-auth: "false"
spec:
  replicas: 1
  nemoConfigs:
    - name: nemoguard
      configMaps:
        - langgraph-guardrailed-agent-guardrails-config
      default: true
  env:
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: langgraph-guardrailed-agent-guardrails-secrets
          key: api-key
    - name: NVIDIA_API_KEY
      valueFrom:
        secretKeyRef:
          name: langgraph-guardrailed-agent-guardrails-secrets
          key: nvidia-api-key
    # OpenTelemetry — envsubst from cluster.env. finalize_nemoguardrails_cr.py
    # strips this block when GUARDRAILS_TRACING_ENABLED is not exactly true.
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
    - name: OTEL_SERVICE_NAME
      value: "${OTEL_SERVICE_NAME}"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "${OTEL_EXPORTER_OTLP_PROTOCOL}"
    - name: OTEL_METRICS_EXPORTER
      value: "${OTEL_METRICS_EXPORTER}"
