# Topic-control classifier: nvidia/Nemotron-3.5-Content-Safety on vLLM.
# Base targets bf16-capable GPUs (A10G+). For T4 see overlays/t4/.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nemotron-model-storage
  labels:
    app.kubernetes.io/name: nemotron-3-5-content-safety
    app.kubernetes.io/component: model-serving
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemotron-3-5-content-safety
  labels:
    app.kubernetes.io/name: nemotron-3-5-content-safety
    app.kubernetes.io/component: model-serving
spec:
  replicas: 1
  # Release the GPU and RWO volume before scheduling the replacement pod.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: nemotron-3-5-content-safety
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nemotron-3-5-content-safety
        app.kubernetes.io/component: model-serving
    spec:
      serviceAccountName: nemotron-vllm
      # GPU nodes commonly carry this taint when GPU sharing is configured;
      # harmless where the taint is absent.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: download-model
          # Plain UID under the restricted SCC cannot write to the fresh PVC;
          # the ServiceAccount is granted anyuid by `make deploy-model`.
          securityContext:
            runAsUser: 0
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              if [ -f /mnt/models/.download-complete ]; then echo "model present, skipping"; exit 0; fi
              pip install --quiet huggingface_hub
              python -c "
              from huggingface_hub import snapshot_download
              snapshot_download(repo_id='nvidia/Nemotron-3.5-Content-Safety',
                                local_dir='/mnt/models',
                                ignore_patterns=['*.pt','*.bin','*.gguf'])
              print('download complete')"
              touch /mnt/models/.download-complete
          volumeMounts:
            - name: model-storage
              mountPath: /mnt/models
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          args:
            - --model
            - /mnt/models
            - --served-model-name
            - nvidia/nemotron-3.5-content-safety
            - --port
            - "8080"
            # auto -> bfloat16 on A10G+ (weights ship bf16). T4 must override
            # to half via overlays/t4 (fp16 verdict quality validated 15/15).
            - --dtype
            - auto
            - --max-model-len
            - "4096"
            # Classifier workload: short prompts, low concurrency. Small
            # batches also keep the 262k-vocab logits tensor (and therefore
            # the profiling peak) small.
            - --max-num-batched-tokens
            - "1024"
            - --max-num-seqs
            - "16"
            - --gpu-memory-utilization
            - "0.85"
            - --enforce-eager
            # Guardrails only ever sends text; skipping vision profiling
            # saves significant GPU memory (SigLIP tower at 896px).
            - --limit-mm-per-prompt
            - '{"image":0}'
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
          volumeMounts:
            - name: model-storage
              mountPath: /mnt/models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: nemotron-model-storage
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nemotron-3-5-content-safety-svc
  labels:
    app.kubernetes.io/name: nemotron-3-5-content-safety
    app.kubernetes.io/component: model-serving
spec:
  selector:
    app.kubernetes.io/name: nemotron-3-5-content-safety
  ports:
    - port: 8080
      targetPort: 8080
