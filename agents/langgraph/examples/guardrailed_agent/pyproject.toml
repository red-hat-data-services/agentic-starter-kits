[project]
name = "guardrailed_agent"
version = "0.1.0"
description = "A banking customer service agent with NeMo Guardrails safety layer. Demonstrates content safety, topical guardrails, and regex filtering using the proxy pattern."
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "langchain>=1.2.10",
    "langchain-openai>=1.1.10",
    "langgraph-prebuilt>=1.0.8",
    "openai>=2.24.0",
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
    "setuptools>=80.9.0,<83.0.0",
    "starlette>=1.0.1",
    "protobuf<7",  # nemoguardrails 0.21.0 pulls grpcio which conflicts with protobuf 7+
    "flask>=3.1.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
auth = [
    "agent-auth",
]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
guardrails = [
    "nemoguardrails[server]==0.21.0",  # pinned to match RHOAI container version
    "dataclasses-json>=0.6.7",  # undeclared transitive dep of nemoguardrails 0.21.0
    "langchain-community>=0.2,<0.4",  # >=0.4 drops GoogleSearchAPIWrapper, breaks nemoguardrails imports
    "langchain-nvidia-ai-endpoints>=1.4.3",  # required for engine=nim (NVIDIA NemoGuard NIM models)
    "opentelemetry-distro>=0.65b0",  # provides the `opentelemetry-instrument` zero-code SDK wrapper
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",  # OTLP/HTTP exporter, configured via OTEL_* env vars
]
tracing = [
    "mlflow[kubernetes]>=3.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
agent-auth = { path = "../../../../components/auth" }

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = [
    "guardrails_integration: live NeMo Guardrails server + LLM required",
    "integration: OpenShift cluster deployment test",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"
