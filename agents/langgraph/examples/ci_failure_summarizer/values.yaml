nameOverride: "langgraph-ci-failure-summarizer-agent"

# Security: /summarize endpoint is unauthenticated in this spike.
# Route is disabled by default to prevent untrusted access.
# Enable only in controlled environments (trusted network / operator-only access).
openshift:
  route:
    enabled: false

env:
  MODEL_ID: ""
  BASE_URL: ""
  POSTGRES_HOST: ""
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ""
  POSTGRES_USER: ""
  GITHUB_REPOSITORY: ""
  GITHUB_WORKFLOW: ""
  GITHUB_WORKFLOW_FILE: ""

extraSecrets: {}
  # Optional sensitive env vars (e.g. GITHUB_TOKEN, SLACK_WEBHOOK_URL) injected from the Helm secret.
