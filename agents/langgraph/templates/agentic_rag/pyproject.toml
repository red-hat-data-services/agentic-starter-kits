[project]
name = "agentic_rag"
version = "0.2.0"
description = "A LangGraph Agentic RAG app using OpenAI-compatible APIs. Supports retrieval-augmented generation with customizable vector stores."
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.12, <3.15"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "langchain>=1.2.10",
    "langchain-openai>=1.1.10",
    "langchain-community>=0.4.1",
    "langchain-milvus>=0.3.3",
    "langgraph-prebuilt>=1.0.0",
    "openai>=2.24.0",
    "pymilvus>=3.0.1",
    "python-dotenv>=1.2.1",
    "setuptools>=80.9.0,<83.0.0",
    "ai4rag~=0.13.0",
    "flask>=3.1.0",
    "requests>=2.31.0",
    "starlette>=1.0.1",
    "pysqlite3-binary>=0.5.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
auth = [
    "agent-auth",
]
dev = [
    "pytest>=9.0.2",
]
tracing = [
    "mlflow>=3.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
agent-auth = { path = "../../../../components/auth" }

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"
