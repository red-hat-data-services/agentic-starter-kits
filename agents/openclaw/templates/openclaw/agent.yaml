name: openclaw
displayName: "OpenClaw"
framework: openclaw
description: "OpenClaw gateway-based agentic coding platform deployed on OpenShift with vLLM/KServe model serving."
labels: ["coding-agent", "gateway"]
logo: "data:image/svg+xml;base64,"
env:
  required:
    - OPENCLAW_GATEWAY_TOKEN
    - VLLM_API_KEY
  optional:
    - OPENCLAW_CONFIG_DIR
    - NODE_ENV
    - MLFLOW_TRACKING_URI
    - MLFLOW_EXPERIMENT_NAME
