apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openclaw
  labels:
    app: openclaw
  annotations:
    haproxy.router.openshift.io/timeout: 30m
    # Do not add X-Forwarded-* headers: OpenClaw answers requests with forwarded headers from
    # a proxy outside gateway.trustedProxies with HTTP 403 (proxy_attribution_required).
    haproxy.router.openshift.io/set-forwarded-headers: never
spec:
  to:
    kind: Service
    name: openclaw
    weight: 100
  port:
    targetPort: gateway
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
