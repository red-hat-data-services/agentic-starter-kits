apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  labels:
    app: openclaw
type: Opaque
stringData:
  # Replace with your own token, e.g. generate one with: openssl rand -hex 32
  # This placeholder is a known-weak value that OpenClaw refuses to start with.
  OPENCLAW_GATEWAY_TOKEN: "change-me-to-a-long-random-token"
  VLLM_API_KEY: "not-needed"
