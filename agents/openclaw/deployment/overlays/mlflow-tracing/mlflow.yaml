# OPTIONAL: Self-hosted MLflow for OpenClaw tracing
# Use this instead of RHOAI's shared MLflow if you don't have RHOAI installed.
# See docs/mlflow-tracing.md "Alternative: Self-hosted MLflow" for details.
#
# No auth, SQLite backend, plain HTTP on port 5000
# Deploy: oc apply -n YOUR-NAMESPACE -f mlflow.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: mlflow
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: ghcr.io/mlflow/mlflow@sha256:bb350de1ae29025e3f78d70a3443047ca863429cc577a28e050c7156ed8d388d  # v3.10.1
          command: ["mlflow", "server"]
          args:
            - "--host=0.0.0.0"
            - "--port=5000"
            - "--allowed-hosts=*"
            - "--serve-artifacts"
            - "--artifacts-destination=file:///mlflow/artifacts"
            - "--backend-store-uri=sqlite:////mlflow/mlflow.db"
          env:
            - name: MLFLOW_ALLOWED_ORIGINS
              value: "*"
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: data
              mountPath: /mlflow
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /version
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-pvc
  labels:
    app: mlflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  to:
    kind: Service
    name: mlflow
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
