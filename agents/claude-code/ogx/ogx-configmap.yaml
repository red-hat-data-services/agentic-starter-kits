# OGX Configuration for Claude Code
#
# This ConfigMap provides the OGX runtime configuration that enables
# the Anthropic Messages API (/v1/messages) in front of a vLLM backend.
#
# OGX serves /v1/messages in two modes, selected by the inference
# provider_type below:
#
#   remote::openai  - translation mode (default). OGX translates Anthropic
#                     Messages requests to OpenAI Chat Completions and back,
#                     including SSE streams. Works with any OpenAI-compatible
#                     backend, including vLLM versions without native
#                     /v1/messages support (e.g., v0.6.x). Extended thinking
#                     is unsupported: set MAX_THINKING_TOKENS=0 on Claude Code.
#                     /v1/messages/count_tokens is also not implemented (501).
#   remote::vllm    - passthrough mode. OGX forwards /v1/messages verbatim to
#                     the backend. Requires vLLM with native Anthropic Messages
#                     support (v0.13.0+ / current RHOAI images). There is NO
#                     automatic fallback to translation — a backend without
#                     /v1/messages returns 404 and OGX surfaces a 500.
#
# Auth fields differ by provider type: remote::openai reads `api_key`,
# remote::vllm reads `api_token`.
#
# Before applying, replace the following placeholders with your values:
#
#   <VLLM_SERVICE>  - vLLM Kubernetes service name (e.g., gpt-oss-120b)
#   <NAMESPACE>     - Namespace where vLLM is running (e.g., redhat-ods-applications)
#   <VLLM_PORT>     - vLLM service port (default: 8000)
#
# Usage:
#   oc apply -f ogx-configmap.yaml -n <NAMESPACE>
apiVersion: v1
kind: ConfigMap
metadata:
  name: ogx-config
  labels:
    app: ogx
    ogx.io/watch: "true"
data:
  config.yaml: |
    version: 2
    distro_name: rh
    image_name: rh

    apis:
    - inference
    - messages

    storage:
      type: sqlite
      config:
        db_path: /tmp/ogx.db

    providers:
      inference:
      - provider_id: vllm
        # remote::openai = translation mode (any vLLM backend).
        # Switch to remote::vllm for passthrough mode (requires
        # vLLM v0.13.0+ with native /v1/messages), and rename
        # api_key below to api_token when switching providers.
        provider_type: remote::openai
        config:
          base_url: http://<VLLM_SERVICE>.<NAMESPACE>.svc.cluster.local:<VLLM_PORT>/v1
          # Auth for the vLLM backend. `fake` works only for unauthenticated
          # demo backends (vLLM's default). If vLLM runs with --api-key, use
          # the real key — but keep it out of committed YAML: inject it from a
          # Kubernetes Secret (e.g. env expansion in the deployment) rather
          # than storing it in this ConfigMap.
          api_key: fake
          max_tokens: 4096
          refresh_models: true # Keep the OGX model registry in sync with vLLM

      messages:
      - provider_id: builtin
        provider_type: inline::builtin   # Enables /v1/messages; delegates to the inference provider
        config:
          kvstore:
            namespace: message_batches
            backend: kv_default
