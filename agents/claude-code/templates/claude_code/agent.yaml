name: claude-code
displayName: "Claude Code"
framework: claude-code
description: "Anthropic's Claude Code CLI deployed as a containerized coding agent on OpenShift. Supports Anthropic API, Vertex AI, vLLM, and OGX backends."
labels: ["coding-agent", "cli"]
logo: "data:image/svg+xml;base64,"
env:
  required:
    - ANTHROPIC_API_KEY
  optional:
    - ANTHROPIC_BASE_URL
    - CLAUDE_MODEL
    - CLAUDE_CONFIG_DIR
    - MCP_CONFIG_FILE
    - MCP_CONFIG_JSON
    - SKIP_PERMISSIONS
    - GITHUB_PAT
    - GIT_USER_NAME
    - GIT_USER_EMAIL
    - MLFLOW_TRACKING_URI
    - MLFLOW_EXPERIMENT_NAME
