# Lychee link checker configuration
# https://lychee.cli.rs/

# Root directory for resolving root-relative links (e.g. /images/logo.svg)
root_dir = "."

# Only successful/redirect responses are accepted as valid.
# Run through .github/scripts/check_links.py (CI and pre-commit): HTTP 429 and
# documented Red Hat docs 403/503 responses are visible UNVERIFIED warnings,
# not successes. Every URL is still requested; 404s on those hosts still fail.
# See docs/link-check-triage.md. Never accept 403/503 globally or exclude a
# whole docs host to hide availability failures (RHAIENG-7920).
accept = ["200", "206", "301", "302", "308"]

# Maximum number of concurrent network requests
max_concurrency = 32

# Timeout for each request (in seconds) — lychee default is 20
timeout = 20

# Number of retries for failed requests — lychee default is 3
max_retries = 3

# Retry wait time (in seconds)
retry_wait_time = 2

# Do not check email addresses
include_mail = false

# Curl-style user agent mitigates some bot filtering; it is not sufficient
# for every runner/IP. Remaining failures are classified by check_links.py.
user_agent = "curl/8.7.1"

# Skip virtual environments and vendored dependencies
# PR template links resolve from repo root in GitHub but from .github/ locally
exclude_path = ["\\.venv", "node_modules", "\\.github/PULL_REQUEST_TEMPLATE\\.md"]

# Domain-scoped exclusions — only skip URLs we've confirmed are false positives.
# Do NOT add a global `accept = [403]` — we want new broken links to surface.
exclude = [
    # Bot-blocking site
    "^https://developer\\.nps\\.gov",

    # Localhost URLs (expected in dev docs)
    "^http://localhost",
    "^http://127\\.0\\.0\\.1",

    # TLS handshake/timeout issues with lychee
    "^https://www\\.gnu\\.org",

    # milvus.io/docs — returns 403 to all automated requests
    "^https://milvus\\.io/docs",
]
