name: "Run QG7 Behavioral Eval"
description: "Run shared cluster behavioral pytest suites after checkout and cluster setup."

inputs:
  agent-name:
    description: "Optional template-layout agent id, or a space-separated list of agent ids. Empty runs all supported agents."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Execute shared QG7 runner
      shell: bash
      env:
        QG7_AGENT_NAME: ${{ inputs.agent-name }}
      run: |
        set -euo pipefail

        if [[ -n "${QG7_AGENT_NAME}" ]]; then
          read -r -a selected_agents <<< "${QG7_AGENT_NAME}"
          bash "tests/behavioral/deterministic/run-btests-pytest.sh" "${selected_agents[@]}"
        else
          bash "tests/behavioral/deterministic/run-btests-pytest.sh"
        fi
