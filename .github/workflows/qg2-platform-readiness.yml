name: "QG2: Platform Readiness"

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      cluster_profile:
        description: "Logical cluster profile name"
        type: string
        default: "rhoai2"
      cluster_type:
        description: "Platform flavor"
        type: choice
        options: [odh, rhoai]
        default: rhoai
      require_dsc_ready:
        description: "Whether DataScienceCluster must be Ready"
        type: boolean
        default: true
      require_kserve:
        description: "Whether KServe controller health is required"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  qg2:
    name: "QG2 Platform Readiness"
    if: github.repository == 'red-hat-data-services/agentic-starter-kits'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup cluster tools
        uses: ./.github/actions/setup-cluster
        with:
          oc-token: ${{ secrets.OC_TOKEN }}
          cluster-api-url: ${{ secrets.CLUSTER_API_URL }}

      - name: Resolve QG2 inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REQUIRE_DSC_READY: ${{ inputs.require_dsc_ready }}
          DISPATCH_REQUIRE_KSERVE: ${{ inputs.require_kserve }}
          VARS_REQUIRE_DSC_READY: ${{ vars.QG2_REQUIRE_DSC_READY }}
          VARS_REQUIRE_KSERVE: ${{ vars.QG2_REQUIRE_KSERVE }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            require_dsc_ready="${DISPATCH_REQUIRE_DSC_READY}"
            require_kserve="${DISPATCH_REQUIRE_KSERVE}"
          else
            require_dsc_ready="${VARS_REQUIRE_DSC_READY:-true}"
            require_kserve="${VARS_REQUIRE_KSERVE:-true}"
          fi
          echo "require-dsc-ready=${require_dsc_ready}" >> "${GITHUB_OUTPUT}"
          echo "require-kserve=${require_kserve}" >> "${GITHUB_OUTPUT}"

      - name: Run QG2
        uses: ./.github/actions/run-qg2
        with:
          cluster-profile: ${{ inputs.cluster_profile || vars.QG2_CLUSTER_PROFILE || 'rhoai2' }}
          cluster-type: ${{ inputs.cluster_type || vars.QG2_CLUSTER_TYPE || 'rhoai' }}
          require-dsc-ready: ${{ steps.resolve.outputs.require-dsc-ready }}
          require-kserve: ${{ steps.resolve.outputs.require-kserve }}
          summary-json-path: qg2-results/summary.json
          summary-md-path: qg2-results/summary.md

      - name: Upload QG2 results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qg2-results
          path: qg2-results/**
          if-no-files-found: warn

      - name: Logout
        if: always()
        run: oc logout || true

  notify-slack:
    name: Notify Slack
    if: >-
      !cancelled() &&
      github.repository == 'red-hat-data-services/agentic-starter-kits' &&
      (github.event_name != 'workflow_dispatch' || github.ref_name == 'main')
    needs: [qg2]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide notification status
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          bash .github/actions/notify-slack/should_notify.sh >> "${GITHUB_OUTPUT}"

      - name: Send Slack notification
        if: steps.gate.outputs.should_notify == 'true'
        uses: ./.github/actions/notify-slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          github_token: ${{ github.token }}
          workflow_name: ${{ github.workflow }}
          event_name: ${{ github.event_name }}
          ref_name: ${{ github.ref_name }}
          run_id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: https://red-hat-data-services.github.io/agentic-starter-kits/
          status: ${{ steps.gate.outputs.status }}
