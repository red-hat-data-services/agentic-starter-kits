name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        with:
          types: |
            feat
            fix
            docs
            chore
            test
            perf
            refactor
            ci
            build
            style
            revert
          subjectPatternError: >
            PR title must follow Conventional Commits: `<type>(optional scope): <description>`.
            The description must be between 10 and 72 characters.
          subjectPattern: ^.{10,72}$
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
