name: Inner Loop Gating

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eval-gating.yml"
      - ".github/actions/run-qg7/**"
      - ".github/actions/setup-cluster/action.yaml"
      - ".github/actions/notify-slack/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/behavioral/**"
      - "agents/**/tests/behavioral/**"
      - "evals/harness/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/eval-gating.yml"
      - ".github/actions/run-qg7/**"
      - ".github/actions/setup-cluster/action.yaml"
      - ".github/actions/notify-slack/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/behavioral/**"
      - "agents/**/tests/behavioral/**"
      - "evals/harness/**"
  workflow_dispatch:
    inputs:
      run_cluster_btests:
        description: "Run deployed-agent behavioral pytest suites on cluster"
        type: boolean
        default: false
      cluster_btests_agents:
        description: "Optional space-separated template-layout agent ids, for example: langgraph/templates/react_agent"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: inner-loop-gating-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cluster-btests:
    name: Cluster Behavioral Tests
    runs-on: ubuntu-latest
    # QG7 now deploys and tears down its own agents in the shared ci-testing
    # namespace. The workflow-level group is scoped per ref, but the workflow
    # triggers on both push and pull_request to main, so two PRs in flight would
    # otherwise deploy and undeploy identical deployment names concurrently.
    # Not cancel-in-progress: a cancelled run would skip its teardown.
    #
    # Residual risk, accepted: QG4 (nightly, 03:00 UTC) deploys the same
    # deployment names into ci-testing and undeploys in a `finally`. A QG4 run
    # overlapping a QG7 run will tear QG7's agents down mid-suite. Fixing that
    # needs a QG4 edit, tracked as follow-up.
    concurrency:
      group: cluster-btests-ci-testing
      cancel-in-progress: false
    # 11 agents through a 4-wide build pool ≈ 3 waves × ~20 min/build-and-deploy,
    # plus the btest run and teardown, plus headroom. Revisit with real numbers
    # from the first full run.
    timeout-minutes: 150
    permissions:
      contents: read
    # Mirrors QG4's per-matrix env (agent-deployment-test.yaml is the
    # authoritative mapping, referenced read-only). The deploy pass writes each
    # agent's .env from its agent.yaml `env` block, reading these; vars an agent
    # does not declare are ignored, and unset optional vars are simply skipped.
    #
    # NVIDIA_API_KEY / GUARDRAILS_MODEL_ID are deliberately omitted: only
    # guardrailed_agent consumes them and it is excluded (RHAIENG-7081).
    env:
      API_KEY: ${{ vars.API_KEY }}
      BASE_URL: ${{ vars.BASE_URL }}
      MODEL_ID: ${{ vars.MODEL_ID }}
      # Route discovery needs cluster-wide route read, which the namespace-scoped
      # CI ServiceAccount does not have. Without this the resolution chain rests
      # entirely on reading the URI off a pre-existing deployment, so the first
      # run against an empty ci-testing would fail the whole deploy pass.
      # Unset falls back to discovery, which is correct for a cluster-admin.
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      # vanilla_python/openai_responses_agent talks to OpenAI, not the cluster LLM.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL_ID: ${{ vars.OPENAI_MODEL_ID }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      MCP_SERVER_URL: ${{ vars.MCP_SERVER_URL }}
      LANGFLOW_AGENT_URL: ${{ vars.LANGFLOW_AGENT_URL }}
      # agentic_rag is in the btest array but not the QG4 matrix, so its deploy
      # path is unproven. VECTOR_STORE_ID is `optional` in its agent.yaml, but the
      # agent crashes at runtime without it — the readiness probe will catch that.
      # OGX_* are its LLM endpoint: the vector store lives behind llama-stack, so
      # the shared BASE_URL 404s on /v1/vector-io/query (see ENV_SOURCE_ALIASES).
      OGX_BASE_URL: ${{ vars.OGX_BASE_URL }}
      OGX_MODEL_ID: ${{ vars.OGX_MODEL_ID }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      EMBEDDING_DIMENSION: ${{ vars.EMBEDDING_DIMENSION }}
      VECTOR_STORE_PROVIDER: ${{ vars.VECTOR_STORE_PROVIDER }}
      VECTOR_STORE_ID: ${{ vars.VECTOR_STORE_ID }}
    steps:
      - name: Resolve cluster btests config
        id: cluster-btests-config
        env:
          INPUT_RUN_CLUSTER_BTESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_cluster_btests || '' }}
          INPUT_CLUSTER_BTESTS_AGENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.cluster_btests_agents || '' }}
          ENABLED_VAR: ${{ vars.EVAL_CLUSTER_BTESTS_ENABLED }}
          AGENTS_VAR: ${{ vars.EVAL_CLUSTER_BTESTS_AGENTS }}
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
          CLUSTER_API_URL: ${{ secrets.CLUSTER_API_URL }}
        run: |
          set -euo pipefail

          enabled="${ENABLED_VAR:-false}"
          if [[ "${INPUT_RUN_CLUSTER_BTESTS}" == "true" ]]; then
            enabled="true"
          fi

          cluster_btests_agents="${AGENTS_VAR:-}"
          if [[ -n "${INPUT_CLUSTER_BTESTS_AGENTS}" ]]; then
            cluster_btests_agents="${INPUT_CLUSTER_BTESTS_AGENTS}"
          fi

          # Collapse newlines/repeated whitespace: GITHUB_OUTPUT is line-oriented and the
          # consumer splits on spaces, so a multiline value would truncate or inject lines.
          _agents=()
          read -r -a _agents <<< "$(tr '\n' ' ' <<< "${cluster_btests_agents}")"
          cluster_btests_agents="${_agents[*]:-}"

          run_cluster_btests="false"
          reason="cluster btests disabled (EVAL_CLUSTER_BTESTS_ENABLED != true)"

          if [[ "${enabled}" == "true" ]]; then
            missing=()
            [[ -z "${OC_TOKEN}" ]] && missing+=("OC_TOKEN")
            [[ -z "${CLUSTER_API_URL}" ]] && missing+=("CLUSTER_API_URL")

            if (( ${#missing[@]} == 0 )); then
              run_cluster_btests="true"
              reason="cluster btests enabled"
            else
              reason="cluster btests skipped (missing: ${missing[*]})"
            fi
          fi

          echo "run_cluster_btests=${run_cluster_btests}" >> "${GITHUB_OUTPUT}"
          echo "cluster_btests_agents=${cluster_btests_agents}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Cluster BTests Decision"
            echo "- run_cluster_btests: \`${run_cluster_btests}\`"
            echo "- agents: \`${cluster_btests_agents:-all}\`"
            echo "- reason: ${reason}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout
        if: steps.cluster-btests-config.outputs.run_cluster_btests == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup cluster tools
        if: steps.cluster-btests-config.outputs.run_cluster_btests == 'true'
        uses: ./.github/actions/setup-cluster
        with:
          oc-token: ${{ secrets.OC_TOKEN }}
          cluster-api-url: ${{ secrets.CLUSTER_API_URL }}

      - name: Install btest runner dependencies
        if: steps.cluster-btests-config.outputs.run_cluster_btests == 'true'
        run: |
          set -euo pipefail
          uv sync --frozen --extra test --extra test-mlflow

      - name: Run QG7 behavioral eval
        if: steps.cluster-btests-config.outputs.run_cluster_btests == 'true'
        uses: ./.github/actions/run-qg7
        env:
          QG7_AGENT_NAME: ${{ steps.cluster-btests-config.outputs.cluster_btests_agents }}

      - name: Upload btest artifacts
        if: always() && steps.cluster-btests-config.outputs.run_cluster_btests == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cluster-btest-results
          path: btest-results/**
          if-no-files-found: warn

      - name: Logout
        if: always() && steps.cluster-btests-config.outputs.run_cluster_btests == 'true'
        run: oc logout || true

  notify-slack:
    name: Notify Slack
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      github.repository == 'red-hat-data-services/agentic-starter-kits' &&
      (github.event_name != 'workflow_dispatch' || github.ref_name == 'main')
    needs: [cluster-btests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide notification status
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          bash .github/actions/notify-slack/should_notify.sh >> "${GITHUB_OUTPUT}"

      - name: Send Slack notification
        if: steps.gate.outputs.should_notify == 'true'
        uses: ./.github/actions/notify-slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          github_token: ${{ github.token }}
          workflow_name: ${{ github.workflow }}
          event_name: ${{ github.event_name }}
          ref_name: ${{ github.ref_name }}
          run_id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: https://red-hat-data-services.github.io/agentic-starter-kits/
          status: ${{ steps.gate.outputs.status }}
