name: Inner Loop Gating

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eval-gating.yml"
      - ".github/actions/run-qg7/**"
      - ".github/actions/setup-cluster/action.yaml"
      - ".github/actions/notify-slack/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/behavioral/**"
      - "agents/**/tests/behavioral/**"
      - "evals/harness/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/eval-gating.yml"
      - ".github/actions/run-qg7/**"
      - ".github/actions/setup-cluster/action.yaml"
      - ".github/actions/notify-slack/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/behavioral/**"
      - "agents/**/tests/behavioral/**"
      - "evals/harness/**"
  workflow_dispatch:
    inputs:
      run_cluster_btests:
        description: "Run deployed-agent behavioral pytest suites on cluster"
        type: boolean
        default: false
      cluster_btests_agents:
        description: "Optional space-separated template-layout agent ids, for example: langgraph/templates/react_agent"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: inner-loop-gating-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cluster-btests:
    name: Cluster Behavioral Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Resolve cluster btests config
        id: cluster-btests-config
        env:
          INPUT_RUN_CLUSTER_BTESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_cluster_btests || '' }}
          INPUT_CLUSTER_BTESTS_AGENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.cluster_btests_agents || '' }}
          ENABLED_VAR: ${{ vars.EVAL_CLUSTER_BTESTS_ENABLED }}
          AGENTS_VAR: ${{ vars.EVAL_CLUSTER_BTESTS_AGENTS }}
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
          CLUSTER_API_URL: ${{ secrets.CLUSTER_API_URL }}
        run: |
          set -euo pipefail

          enabled="${ENABLED_VAR:-false}"
          if [[ "${INPUT_RUN_CLUSTER_BTESTS}" == "true" ]]; then
            enabled="true"
          fi

          cluster_btests_agents="${AGENTS_VAR:-}"
          if [[ -n "${INPUT_CLUSTER_BTESTS_AGENTS}" ]]; then
            cluster_btests_agents="${INPUT_CLUSTER_BTESTS_AGENTS}"
          fi

          # Collapse newlines/repeated whitespace: GITHUB_OUTPUT is line-oriented and the
          # consumer splits on spaces, so a multiline value would truncate or inject lines.
          _agents=()
          read -r -a _agents <<< "$(tr '\n' ' ' <<< "${cluster_btests_agents}")"
          cluster_btests_agents="${_agents[*]:-}"

          run_cluster_btests="false"
          reason="cluster btests disabled (EVAL_CLUSTER_BTESTS_ENABLED != true)"

          if [[ "${enabled}" == "true" ]]; then
            missing=()
            [[ -z "${OC_TOKEN}" ]] && missing+=("OC_TOKEN")
            [[ -z "${CLUSTER_API_URL}" ]] && missing+=("CLUSTER_API_URL")

            if (( ${#missing[@]} == 0 )); then
              run_cluster_btests="true"
              reason="cluster btests enabled"
            else
              reason="cluster btests skipped (missing: ${missing[*]})"
            fi
          fi

          echo "run_cluster_btests=${run_cluster_btests}" >> "${GITHUB_OUTPUT}"
          echo "cluster_btests_agents=${cluster_btests_agents}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Cluster BTests Decision"
            echo "- run_cluster_btests: \`${run_cluster_btests}\`"
            echo "- agents: \`${cluster_btests_agents:-all}\`"
            echo "- reason: ${reason}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout
        if: steps.cluster-btests-config.outputs.run_cluster_btests == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup cluster tools
        if: steps.cluster-btests-config.outputs.run_cluster_btests == 'true'
        uses: ./.github/actions/setup-cluster
        with:
          oc-token: ${{ secrets.OC_TOKEN }}
          cluster-api-url: ${{ secrets.CLUSTER_API_URL }}

      - name: Install btest runner dependencies
        if: steps.cluster-btests-config.outputs.run_cluster_btests == 'true'
        run: |
          set -euo pipefail
          uv sync --frozen --extra test --extra test-mlflow

      - name: Run QG7 behavioral eval
        if: steps.cluster-btests-config.outputs.run_cluster_btests == 'true'
        uses: ./.github/actions/run-qg7
        env:
          QG7_AGENT_NAME: ${{ steps.cluster-btests-config.outputs.cluster_btests_agents }}

      - name: Upload btest artifacts
        if: always() && steps.cluster-btests-config.outputs.run_cluster_btests == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cluster-btest-results
          path: btest-results/**
          if-no-files-found: warn

      - name: Logout
        if: always() && steps.cluster-btests-config.outputs.run_cluster_btests == 'true'
        run: oc logout || true

  notify-slack:
    name: Notify Slack
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      github.repository == 'red-hat-data-services/agentic-starter-kits' &&
      (github.event_name != 'workflow_dispatch' || github.ref_name == 'main')
    needs: [cluster-btests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide notification status
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          bash .github/actions/notify-slack/should_notify.sh >> "${GITHUB_OUTPUT}"

      - name: Send Slack notification
        if: steps.gate.outputs.should_notify == 'true'
        uses: ./.github/actions/notify-slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          github_token: ${{ github.token }}
          workflow_name: ${{ github.workflow }}
          event_name: ${{ github.event_name }}
          ref_name: ${{ github.ref_name }}
          run_id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: https://red-hat-data-services.github.io/agentic-starter-kits/
          status: ${{ steps.gate.outputs.status }}
